<!DOCTYPE html> <html lang="it"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Guitar Lab</title> <style> /* ========================================================= RESET ========================================================= */ * { box-sizing: border-box; margin: 0; padding: 0; } html { scroll-behavior: smooth; } body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient( circle at 15% 10%, rgba(245,185,66,.10), transparent 30% ), radial-gradient( circle at 85% 20%, rgba(80,120,255,.08), transparent 30% ), #090c11; color: #f5f7fa; min-height: 100vh; overflow-x: hidden; } /* ========================================================= SCROLLBAR ========================================================= */ ::-webkit-scrollbar { width: 9px; height: 9px; } ::-webkit-scrollbar-track { background: #0c1016; } ::-webkit-scrollbar-thumb { background: #303946; border-radius: 20px; } ::-webkit-scrollbar-thumb:hover { background: #46515f; } /* ========================================================= VARIABLES ========================================================= */ :root { --gold: #f5b942; --gold-light: #ffd778; --gold-dark: #b98118; --bg: #090c11; --panel: #11161e; --panel-2: #151b24; --panel-3: #1b222d; --border: rgba(255,255,255,.08); --text: #f5f7fa; --muted: #929dab; --green: #45d483; --blue: #63a4ff; --red: #ff6472; } /* ========================================================= NAVBAR ========================================================= */ .navbar { position: sticky; top: 0; z-index: 1000; height: 72px; display: flex; align-items: center; background: rgba(9,12,17,.88); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,255,.07); } .navbar-inner { width: min(1400px, calc(100% - 32px)); margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; } .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--text); cursor: pointer; white-space: nowrap; } .logo-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient( 135deg, var(--gold), #d89019 ); color: #111; font-size: 19px; box-shadow: 0 8px 25px rgba(245,185,66,.20); } .nav-links { display: flex; align-items: center; gap: 5px; } .nav-button { border: 0; background: transparent; color: var(--muted); padding: 10px 15px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s, transform .2s; } .nav-button:hover { background: rgba(255,255,255,.05); color: white; } .nav-button.active { color: var(--gold); background: rgba(245,185,66,.10); } /* ========================================================= MAIN ========================================================= */ main { width: min(1400px, calc(100% - 32px)); margin: auto; } .page { display: none; padding: 45px 0 70px; animation: pageIn .35s ease; } .page.active { display: block; } @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } /* ========================================================= HERO ========================================================= */ .hero { min-height: 560px; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 60px; } .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(245,185,66,.08); border: 1px solid rgba(245,185,66,.20); color: var(--gold); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 20px; } .hero h1 { font-size: clamp(42px, 7vw, 78px); line-height: .95; letter-spacing: -.05em; margin-bottom: 25px; } .hero h1 span { color: var(--gold); } .hero p { max-width: 650px; color: var(--muted); font-size: clamp(16px, 2vw, 19px); line-height: 1.7; margin-bottom: 32px; } .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; } .primary-button, .secondary-button { border: 0; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s; } .primary-button { background: linear-gradient( 135deg, var(--gold), #dc951f ); color: #111; box-shadow: 0 10px 30px rgba(245,185,66,.18); } .secondary-button { background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--border); } .primary-button:hover, .secondary-button:hover { transform: translateY(-2px); } .hero-visual { position: relative; min-height: 420px; border-radius: 28px; overflow: hidden; background: linear-gradient( 145deg, #171d27, #0d1118 ); border: 1px solid var(--border); box-shadow: 0 30px 80px rgba(0,0,0,.35); } .hero-visual::before { content: ""; position: absolute; width: 280px; height: 280px; background: rgba(245,185,66,.12); filter: blur(70px); top: -80px; right: -60px; } .hero-neck { position: absolute; left: 10%; right: 5%; top: 50%; transform: translateY(-50%) rotate(-7deg); height: 190px; background: linear-gradient( 90deg, #5c321b, #9a5d2d, #60361d ); border-radius: 15px 28px 28px 15px; box-shadow: 0 30px 40px rgba(0,0,0,.4); } .hero-string { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.55); } .hero-string:nth-child(1) { top: 16%; } .hero-string:nth-child(2) { top: 30%; } .hero-string:nth-child(3) { top: 43%; } .hero-string:nth-child(4) { top: 57%; } .hero-string:nth-child(5) { top: 70%; } .hero-string:nth-child(6) { top: 84%; } .hero-fret { position: absolute; top: 0; bottom: 0; width: 3px; background: linear-gradient( 90deg, #aaa, #444, #ddd ); } .hero-fret:nth-child(7) { left: 20%; } .hero-fret:nth-child(8) { left: 35%; } .hero-fret:nth-child(9) { left: 50%; } .hero-fret:nth-child(10) { left: 65%; } .hero-fret:nth-child(11) { left: 80%; } .hero-note { position: absolute; width: 36px; height: 36px; border-radius: 5 .keyboard-labels { position: sticky; left: 0; width: 70px; height: 430px; margin-right: -70px; margin-bottom: -430px; z-index: 10; pointer-events: none; } .note-neck { position: relative; width: 2050px; min-width: 2050px; height: 430px; border-radius: 16px; overflow: hidden; background: linear-gradient( 90deg, #171b20 0 70px, #71401f 70px, #8d5228 50%, #60351d 100% ); border: 1px solid rgba(255,255,255,.10); } /* --------------------------------------------------------- fret lines --------------------------------------------------------- */ .new-fret-line { position: absolute; top: 0; bottom: 0; width: 3px; background: linear-gradient( 90deg, #bfc3c7, #555b62, #dfe3e6 ); opacity: .9; } /* --------------------------------------------------------- fret markers --------------------------------------------------------- */ .fret-marker-new { position: absolute; width: 13px; height: 13px; border-radius: 50%; transform: translate(-50%, -50%); background: rgba(245,247,250,.65); box-shadow: 0 0 10px rgba(255,255,255,.15); } .fret-marker-new.double::before, .fret-marker-new.double::after { content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%; background: rgba(245,247,250,.65); } .fret-marker-new.double::before { top: -28px; } .fret-marker-new.double::after { top: 28px; } /* --------------------------------------------------------- strings --------------------------------------------------------- */ .new-string { position: absolute; left: 0; right: 0; transform: translateY(-50%); background: linear-gradient( 90deg, #dadada, #8e8e8e, #ededed ); box-shadow: 0 1px 3px rgba(0,0,0,.6); z-index: 2; } .new-string.s1 { height: 2px; } .new-string.s2 { height: 2px; } .new-string.s3 { height: 3px; } .new-string.s4 { height: 4px; } .new-string.s5 { height: 5px; } .new-string.s6 { height: 6px; } /* --------------------------------------------------------- string labels --------------------------------------------------------- */ .new-string-label { position: absolute; left: 0; width: 70px; transform: translateY(-50%); text-align: center; color: #111; background: #fff; border-radius: 4px; font-size: 14px; font-weight: 800; z-index: 5; color-scheme: only light; forced-color-adjust: none; } /* --------------------------------------------------------- NOTES --------------------------------------------------------- */ .note-cell { position: absolute; transform: translate(-50%, -50%); width: 46px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: rgba(10,13,18,.78); border: 1px solid rgba(255,255,255,.20); color: #f7f9fc; font-size: 13px; font-weight: 800; letter-spacing: .01em; z-index: 4; cursor: pointer; transition: background .18s, color .18s, border .18s, box-shadow .18s, transform .18s; text-shadow: 0 1px 2px rgba(0,0,0,.8); } .note-cell:hover { background: rgba(245,185,66,.16); border-color: rgba(245,185,66,.55); color: white; transform: translate(-50%, -50%) scale(1.08); } .note-cell.same-note { background: linear-gradient( 135deg, #f5b942, #d9931e ); color: #121212; border-color: #ffd778; box-shadow: 0 0 0 2px rgba(245,185,66,.14), 0 8px 20px rgba(0,0,0,.25); text-shadow: none; } .note-cell.selected-note { background: #fff; color: #111; border: 3px solid var(--gold); box-shadow: 0 0 0 4px rgba(245,185,66,.25), 0 0 30px rgba(245,185,66,.7); z-index: 8; } /* ========================================================= ACCORDS LAYOUT ========================================================= */ .chords-layout { display: block; } /* ========================================================= CHORD CONTROLS ========================================================= */ .chord-controls { padding: 20px; margin-bottom: 24px; } .control-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; margin-bottom: 12px; } .root-buttons { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-bottom: 25px; } .root-butt nd: rgba(255,255,255,.035); color: var(--muted); line-height: 1.8; } .builder-root-display strong { color: var(--gold); font-size: 20px; } .builder-selection-info { margin-top: 15px; color: var(--muted); font-size: 12px; line-height: 1.7; } .builder-selection-info strong { color: var(--text); } .builder-keyboard-panel { padding: 20px; overflow: hidden; } .builder-toolbar { display: flex; justify-content: flex-end; margin-bottom: 18px; } .builder-toolbar .reset-button { width: auto; } .builder-scroll { overflow-x: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; } .builder-labels { position: sticky; left: 0; width: 70px; height: 430px; margin-right: -70px; margin-bottom: -430px; z-index: 10; pointer-events: none; } .builder-neck { position: relative; width: 2050px; min-width: 2050px; height: 430px; border-radius: 16px; overflow: hidden; background: linear-gradient( 90deg, #171b20 0 70px, #71401f 70px, #8d5228 50%, #60351d 100% ); border: 1px solid rgba(255,255,255,.10); } .builder-fret { position: absolute; top: 0; bottom: 0; width: 3px; background: linear-gradient( 90deg, #bbb, #555, #ddd ); } .builder-fret-number { position: absolute; top: 12px; transform: translateX(-50%); color: rgba(255,255,255,.65); font-size: 11px; } .builder-nut { position: absolute; left: 70px; top: 0; bottom: 0; width: 8px; background: #e5e5e5; z-index: 3; } .builder-string { position: absolute; left: 0; right: 0; transform: translateY(-50%); background: linear-gradient( 90deg, #ddd, #777, #eee ); z-index: 2; } .builder-string.s1 { height: 2px; } .builder-string.s2 { height: 2px; } .builder-string.s3 { height: 3px; } .builder-string.s4 { height: 4px; } .builder-string.s5 { height: 5px; } .builder-string.s6 { height: 6px; } .builder-string-label { position: absolute; left: 0; width: 70px; transform: translateY(-50%); text-align: center; color: #111; background: #fff; border-radius: 4px; font-size: 14px; font-weight: 800; z-index: 6; color-scheme: only light; forced-color-adjust
